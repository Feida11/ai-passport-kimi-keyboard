; Kimi voice-programming remote bridge configuration.
; Copy to config.ini and edit. All keys are optional.

[ble]
; Advertised BLE name of the device.
device_name = KimiRemote

[asr]
; faster-whisper model size (tiny/base/small/medium/large-v3) or a local path.
model_size = small
; Local model directory; empty = download by model_size.
model_path =
language = zh
compute_type = int8

[kimi]
; Operating mode:
;   kimi     = locate the Kimi Code window and watch its permission dialogs
;   universal = paste into whatever window currently has focus (any app),
;               no permission watching
mode = kimi
; Regex matched against top-level window titles to find the Kimi Code window.
window_title_regex = Kimi
; Press Enter after pasting the recognized text.
auto_enter = true
inject_retries = 5
inject_retry_interval = 0.5

[perm]
; Poll interval for permission dialogs (seconds).
poll_interval = 0.6
; Button name patterns (regex). allow wins if both match.
allow_pattern = 允许|批准|Allow|Approve|Yes|是
deny_pattern = 拒绝|取消|Deny|Reject|No|否
; Device-side prompt timeout (seconds).
timeout = 60

[bridge]
; Periodic link check / battery ping (seconds, 0 = disable).
ping_interval = 20
; Grace period after rec_stop / last audio frame before finalizing (ms).
grace_ms = 500
